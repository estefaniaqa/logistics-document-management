<style>
:root {
  --brand-primary: #0E7490;
  --brand-primary-dark: #155E75;
  --brand-primary-light: #E6F6F9;
  --brand-navy: #16324F;
  --success: #65A30D;
  --warning: #F59E0B;
  --danger: #DC2626;
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --surface-alt: #F1F3F5;
  --border: #DCE3E8;
  --text-1: #1F2933;
  --text-2: #52606D;
  --text-3: #7B8794;
  --font: 'Montserrat', sans-serif;
  --radius-sm: 3px;
  --radius-md: 5px;
  --radius-lg: 6px;
  --radius-xl: 8px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-1);
  font-size: 14px;
}

.top-brand-bar { height: 8px; background: var(--brand-primary); }
.app-shell { display: flex; min-height: calc(100vh - 8px); }

.sidebar {
  width: 248px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--brand-navy);
  color: var(--surface);
}

.brand { padding: 32px 24px; border-bottom: 1px solid #36566D; }
.brand-name { font-size: 28px; font-weight: 800; letter-spacing: -0.015em; }
.brand-subtitle {
  margin-top: 8px;
  color: #67D2E4;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
}

.navigation { padding: 24px 16px; flex: 1; }

.nav-item {
  width: 100%;
  border: 0;
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 8px;
  background: transparent;
  color: var(--surface);
  text-align: left;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
}

.nav-item:hover { background: var(--brand-primary-dark); }
.nav-item.active { background: var(--brand-primary); font-weight: 700; }
.nav-number { display: inline-block; width: 32px; font-weight: 700; }

.sidebar-footer { padding: 24px; color: var(--text-3); font-size: 11px; }

.portfolio-badge {
  display: inline-block;
  margin-bottom: 16px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  background: var(--brand-primary);
  color: var(--surface);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
}

.user-email { word-break: break-word; color: #E8EEF2; }
.version { margin-top: 8px; }

.main-content { min-width: 0; flex: 1; padding: 32px; }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 32px;
  padding-bottom: 16px;
  border-bottom: 3px solid var(--brand-primary);
}

.section-number {
  color: var(--brand-primary);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .15em;
}

h1 { margin: 4px 0 8px; color: var(--brand-navy); font-size: 32px; line-height: 1.1; }
h2 { margin: 4px 0; color: var(--brand-navy); font-size: 24px; }
h3 { color: var(--brand-navy); font-size: 18px; }
p { margin: 0; color: var(--text-2); line-height: 1.6; }

.btn {
  min-height: 40px;
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
}

.btn.primary { border: 1px solid var(--brand-primary); background: var(--brand-primary); color: var(--surface); }
.btn.primary:hover { background: var(--brand-primary-dark); }
.btn.secondary { border: 1px solid var(--brand-primary); background: var(--surface); color: var(--brand-primary-dark); }
.btn.ghost { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
.btn:disabled { opacity: .55; cursor: wait; }

.view { display: none; }
.view.active { display: block; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.kpi-card {
  padding: 24px;
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-radius: var(--radius-lg);
  background: var(--surface);
}

.kpi-card.info { border-left-color: var(--brand-primary); }
.kpi-card.success { border-left-color: var(--success); }
.kpi-card.warning { border-left-color: var(--warning); }
.kpi-card.danger { border-left-color: var(--danger); }

.kpi-label { display: block; color: var(--text-3); font-size: 10px; font-weight: 700; letter-spacing: .08em; }
.kpi-value { display: block; margin: 8px 0; color: var(--brand-navy); font-size: 28px; }
.kpi-description { color: var(--text-2); font-size: 11px; }

.section-header { margin-bottom: 16px; }

.table-container {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}

table { width: 100%; border-collapse: collapse; }
th {
  padding: 16px;
  background: var(--brand-navy);
  color: var(--surface);
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .05em;
}
td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 12px; }
tbody tr:nth-child(even) { background: var(--surface-alt); }
.empty-table { padding: 32px; text-align: center; color: var(--text-3); }

.toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
.search-input { width: min(560px, 100%); }

input, select, textarea {
  width: 100%;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--text-1);
  font-family: inherit;
  font-size: 14px;
}

input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--brand-primary-light);
  border-color: var(--brand-primary);
}

.field label {
  display: block;
  margin-bottom: 8px;
  color: var(--text-3);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .05em;
}

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.form-section { margin-bottom: 32px; }
.form-section h3 { margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.checkbox-field { display: flex; align-items: center; gap: 8px; }
.checkbox-field input { width: auto; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(22, 50, 79, .62);
}

.modal {
  width: min(920px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  padding: 32px;
  border-radius: var(--radius-xl);
  background: var(--surface);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 32px;
  padding-bottom: 16px;
  border-bottom: 3px solid var(--brand-primary);
}

.close-button {
  width: 40px;
  height: 40px;
  border: 0;
  background: transparent;
  color: var(--text-2);
  font-size: 28px;
  cursor: pointer;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.info-alert {
  padding: 24px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--brand-primary);
  border-radius: var(--radius-lg);
  background: var(--brand-primary-light);
}

.info-alert strong { display: block; margin-bottom: 8px; color: var(--brand-navy); }

.form-message {
  margin-bottom: 16px;
  padding: 16px;
  border-left: 4px solid var(--danger);
  border-radius: var(--radius-lg);
  background: var(--surface-alt);
  color: var(--danger);
}

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 2000;
  max-width: 400px;
  padding: 16px 24px;
  border-left: 4px solid var(--success);
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--brand-navy);
  box-shadow: 0 8px 32px rgba(22, 50, 79, .16);
  font-weight: 600;
}

.hidden { display: none !important; }

@media (max-width: 900px) {
  .sidebar { width: 200px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 680px) {
  .app-shell { display: block; }
  .sidebar { width: 100%; }
  .navigation { display: flex; overflow-x: auto; }
  .nav-item { min-width: 160px; }
  .main-content { padding: 16px; }
  .page-header { flex-direction: column; }
  .kpi-grid, .form-grid { grid-template-columns: 1fr; }
}
</style>
